experiment_name: baseline
seeds: [42, 1337, 2026]               # 多 seed 实验,产物各自落到 outputs/<name>-s<seed>/

model:
  name_or_path: bert-base-chinese    # 备选:hfl/chinese-bert-wwm-ext
  num_labels: 2

data:
  max_seq_length: 128

train:
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 3
  warmup_ratio: 0.1
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  fp16: false
  bf16: true                          # 4080 SUPER 支持 bf16,比 fp16 更稳

output:
  base_dir: outputs                   # 最终输出目录:outputs/<experiment_name>/
